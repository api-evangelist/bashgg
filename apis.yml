name: bash.gg
description: bash.gg was a browser-based indie game marketplace built on Solana (founded by Kyle Zappitell,
  a former Xbox engineer) that let independent developers sell games directly in the browser without the
  ~30% platform commissions charged by Steam, Xbox, Apple, and PlayStation, with 10% royalties routed back
  to developers on resale. It entered the API Evangelist network as a venture-portfolio lead and was kept
  as a stub. Re-probed on 2026-07-20, the company remains defunct - the bash.gg domain is parked for sale
  on the GoDaddy/Afternic aftermarket (NS delegated to afternic.com, null MX, SPF "-all"), there is no live
  developer portal, API, or documentation, and the company GitHub organization (github.com/bash-gg) exists
  but publishes zero repositories. Wayback captures show the site only ever exposed Next.js/NextAuth internal
  routes (/api/auth/session), never a public developer API. No provider artifacts could be searched,
  generated, or derived. No fabrication was performed.
